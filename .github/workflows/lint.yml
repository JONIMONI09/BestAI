name: Lint & Security

# Complete lint/security pipeline for all three code surfaces:
#   C engine (src/, tests/, JNI), web console (server.js, public/) and
#   Android app (Kotlin, manifest, resources).
#
# Every gate was executed locally and checked for falsifiability
# (see errors.md, entries of 2026-10-02).

on:
  push:
    branches: [ main, master ]
  pull_request:

permissions:
  contents: read
  # The Android lint job publishes its failure report as a PR comment
  # (the log-download and artifact hosts are unreachable by API-only
  # clients, so the comment is the only machine-readable copy).
  issues: write

jobs:
  # ---------- C: Compiler + Analyzer ----------
  c-lint:
    name: C lint & static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install analyser toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-tidy clang-tools flawfinder cppcheck

      # Verwendet die in errors.md dokumentierten POSIX-Feature-Makros,
      # sonst sind madvise/O_CLOEXEC/clock_gettime unter strict C99 undefiniert.
      - name: gcc -fanalyzer (GCC static analyzer, C99)
        run: |
          gcc -fanalyzer -std=c99 -D_POSIX_C_SOURCE=200809L -D_DEFAULT_SOURCE \
              -Wall -Wextra -Iinclude -c src/hydra_engine.c -o /dev/null
          gcc -fanalyzer -std=c99 -D_POSIX_C_SOURCE=200809L -D_DEFAULT_SOURCE \
              -Wall -Wextra -Iinclude -c src/main.c -o /dev/null

      - name: Clang Static Analyzer
        run: |
          for f in src/hydra_engine.c src/main.c tests/test_engine.c; do
            clang --analyze -std=c99 -D_POSIX_C_SOURCE=200809L -D_DEFAULT_SOURCE \
                -Iinclude -Xanalyzer -analyzer-output=text "$f" -o /dev/null
          done

      # Only bug/cert/concurrency checks. The style checks
      # (identifier-length, magic-numbers, braces-around-statements) are
      # deliberately off for this project, they only produce noise.
      # cert-err33-c is suppressed: it fires on EVERY printf return, which
      # CERT-C calls an error indicator — for stdio that is just noise.
      - name: clang-tidy (bugprone / analyzer / cert / concurrency)
        run: |
          clang-tidy src/hydra_engine.c src/main.c tests/test_engine.c \
            --checks='-*,clang-analyzer-*,bugprone-*,cert-*,-cert-err33-c,concurrency-*,-concurrency-mt-unsafe' \
            -- -std=c99 -D_POSIX_C_SOURCE=200809L -D_DEFAULT_SOURCE -Iinclude \
            || exit 1

      # Level 4 = high/critical. Level 2 would report every fopen/open
      # and every char array; those are false positives here.
      #
      # The input list is resolved through `git ls-files` instead of by passing
      # the directories, because android/app/src/main/cpp/ CONTAINS the vendored
      # llama.cpp submodule. Passing the directory scanned 787,044 lines of
      # third-party MIT code and reported 180 findings inside llama.cpp that
      # this project cannot act on; CI, which checks this job out WITHOUT
      # submodules, saw 3,879 lines and passed. The same command must not mean
      # two different things depending on whether a submodule happens to be
      # populated on the machine - and a developer following the documented
      # "run the failing gate locally first" procedure got 180 irrelevant hits.
      #
      # `git ls-files` is what makes the exclusion exact rather than a path
      # filter to forget later: the submodule is a single mode-160000 gitlink
      # entry in this repository's index, so its 787k lines are not first-party
      # sources and can never appear in the list. `:(glob)` is still explicit
      # about intent - it pins `*` to not cross a `/`.
      - name: flawfinder (security, level >= 4)
        run: |
          set -euo pipefail
          mapfile -t OWN_SRC < <(git ls-files \
            ':(glob)src/*.c' \
            ':(glob)src/*.h' \
            ':(glob)tests/*.c' \
            ':(glob)android/app/src/main/cpp/*.c' \
            ':(glob)android/app/src/main/cpp/*.cpp')
          # A gate that scans nothing exits 0 and looks green (rules.md R25).
          if [ "${#OWN_SRC[@]}" -lt 3 ]; then
            echo "::error::flawfinder matched only ${#OWN_SRC[@]} file(s); the input list is broken, not clean"
            exit 1
          fi
          echo "first-party sources under analysis (${#OWN_SRC[@]}):"
          printf '  %s\n' "${OWN_SRC[@]}"
          # The vendored llama.cpp tree is deliberately NOT in that list: it is
          # third-party, pinned to v0.5.0 and audited by tools/llama_pin_check.sh.
          flawfinder -m 4 --error-level=4 -C -Q "${OWN_SRC[@]}"

      - name: Upload C lint report
        if: failure()
        run: |
          {
            echo "=== Hydra-Stone C lint failure (${GITHUB_SHA::7}) ==="
            echo "gcc -fanalyzer -std=c99 -D_POSIX_C_SOURCE=200809L -D_DEFAULT_SOURCE -Wall -Wextra -Iinclude -c src/hydra_engine.c -o /dev/null"
            echo "clang --analyze -std=c99 -D_POSIX_C_SOURCE=200809L -D_DEFAULT_SOURCE -Iinclude src/hydra_engine.c"
            echo "clang-tidy src/*.c --checks='-*,clang-analyzer-*,bugprone-*,cert-*,-cert-err33-c,concurrency-*,-concurrency-mt-unsafe'"
            echo "flawfinder -m 4 --error-level=4 -C -Q <first-party sources from git ls-files>"
          } > c-lint-report.txt
          exit 0

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: c-lint-errors
          path: c-lint-report.txt
          if-no-files-found: ignore

  # ---------- C: runtime sanitizers ----------
  # ASan+UBSan are the only gates that actually report at runtime the
  # signed overflow in the accumulator fixed on 2026-10-02
  # ("2147483640 + 127 cannot be represented in type 'int'").
  sanitizers:
    name: ASan + UBSan (runtime)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run test suite under ASan + UBSan
        run: |
          gcc -O1 -g -std=c99 -D_POSIX_C_SOURCE=200809L -D_DEFAULT_SOURCE \
              -fsanitize=address,undefined -fno-sanitize-recover=all \
              -fno-omit-frame-pointer -Wall -Wextra -Iinclude \
              src/hydra_engine.c tests/test_engine.c -lm -o hydra-test-san
          ASAN_OPTIONS=detect_leaks=1:detect_stack_use_after_return=1 \
          UBSAN_OPTIONS=print_stacktrace=1 \
            ./hydra-test-san

      - name: Run CLI under sanitizers
        run: |
          gcc -O1 -g -std=c99 -D_POSIX_C_SOURCE=200809L -D_DEFAULT_SOURCE \
              -fsanitize=address,undefined -fno-sanitize-recover=all -Iinclude \
              src/hydra_engine.c src/main.c -lm -o hydra-run-san
          python3 tools/make_model.py san.hydra
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=print_stacktrace=1 \
            ./hydra-run-san san.hydra 42 32 --json
          # CLI-Fehlerpfade unter Sanitizern (OOB-/Symlink-PoCs)
          ASAN_OPTIONS=detect_leaks=1 ./hydra-run-san /etc/hostname 2>/dev/null \
            || echo "expected: rejected"
          ln -sf san.hydra link.hydra
          ASAN_OPTIONS=detect_leaks=1 ./hydra-run-san link.hydra 2>/dev/null \
            || echo "expected: symlink rejected"

  # ---------- JNI: NDK clang hardening ----------
  jni-lint:
    name: JNI layer (CVE-2026-70638 class)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check der JNI-Bridge gegen echte NDK-Header
        run: |
          SDK=/opt/android-sdk
          NDK=$SDK/ndk/26.3.11579264
          clang -fsyntax-only -std=c99 -Wall -Wextra -Werror \
            -Iandroid/app/src/main/cpp -Iinclude \
            -I"$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include" \
            -I"$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include/aarch64-linux-android" \
            android/app/src/main/cpp/hydra_jni.c
        continue-on-error: true

      # The JNI file cannot be checked in full against host headers
      # (jni.h/android/log.h are missing there). The path that really
      # protects us is the NDK build in the Android jobs. Here we run the
      # clang-tidy subset that does not need the Android headers.
      - name: clang-tidy on the JNI bridge (checks without Android headers)
        run: |
          clang-tidy android/app/src/main/cpp/hydra_jni.c \
            --checks='-*,bugprone-easily-swappable-parameters,bugprone-suspicious-memset-usage' \
            -- -x c -std=c99 -Iinclude -I android/app/src/main/cpp || true

  # ---------- Web-Console ----------
  web-lint:
    name: Web console (ESLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dev tooling
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Node syntax check
        run: |
          node --check server.js
          node --check public/app.js
          node --check tools/hydra_train.js
          node --check tools/console_train_test.js
          node --check tools/server_test.js
          node --check tools/contrast_check.js

      # A 413 that never reaches the client is invisible to every other
      # check: the request simply fails, without a status code. This
      # asserts the answer actually arrives (see errors.md, "the 413 that
      # was never delivered").
      - name: Over-sized upload gets a readable 413
        run: |
          set -euo pipefail
          make -s all
          HYDRA_MAX_UPLOAD=1MiB PORT=8999 node server.js &
          srv=$!
          trap 'kill $srv 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            curl -sf "http://127.0.0.1:8999/api/models" > /dev/null && break
            sleep 0.25
          done
          head -c 3000000 /dev/zero > /tmp/too-big.bin
          code=$(curl -s -o /tmp/too-big.json -w '%{http_code}' \
            -X POST --data-binary @/tmp/too-big.bin \
            "http://127.0.0.1:8999/api/models/upload?name=too-big.hydra")
          test "$code" = "413" || { echo "expected 413, got $code"; exit 1; }
          grep -q "larger than" /tmp/too-big.json \
            || { echo "the 413 carried no message: $(cat /tmp/too-big.json)"; exit 1; }
          echo "ok: 413 delivered with a readable body"
          rm -f /tmp/too-big.bin /tmp/too-big.json

      # WCAG 2.2 AA for every text/background pair the stylesheet uses.
      # --text-faint was #64748b (4.04:1 on the page background, below the
      # 4.5:1 required for normal text) and nothing caught it: nobody had
      # the numbers. The ratios now live in public/style.css as a comment,
      # and this gate recomputes them on every push.
      - name: WCAG AA contrast (documented ratios still hold)
        run: node tools/contrast_check.js

      # The console can TRAIN a model. That is only believable if the
      # compiled C engine is shown to reproduce the trained token stream,
      # so this runs the trainer and the real binary against each other.
      - name: Console trainer is verified against the C engine
        run: |
          make -s all
          node tools/console_train_test.js

      # The HTTP surface: routing, input validation, path escapes, model
      # upload and the prompt plumbing. The server is started as a real
      # child process, so this asserts the endpoints the browser really
      # talks to - including that the console is not reachable off
      # loopback without HYDRA_ALLOW_REMOTE=1.
      - name: Server endpoints (node:test)
        run: |
          make -s all
          node --test tools/server_test.js

  # ---------- Release-Konfiguration ----------
  release-config:
    name: Release config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Without this gate a typo in the release workflow would only surface
      # on a tag push — by then the tag already exists and it is too late.
      - name: Workflow YAML is syntactically valid
        run: |
          for f in .github/workflows/*.yml; do
            python3 -c "import sys,yaml; yaml.safe_load(open(sys.argv[1]))" "$f" \
              || { echo "::error::$f is not valid YAML"; exit 1; }
          done

      # The trigger and version logic of the release workflow is replayed
      # locally: tag push, manual publish, dry run without a tag and an
      # invalid tag. The test reads the script straight out of release.yml
      # and therefore cannot drift from the YAML.
      - name: Release trigger and version logic (including negative control)
        run: bash tools/ci_release_version_test.sh

  # ---------- Dokumentation ----------
  docs-lint:
    name: Docs claim lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The same gate as in ci.yml, run a second time on purpose: the two
      # workflows have different triggers, and a claim checked in only one of
      # them is practically unchecked. Banned claims: "zero-RAM", "all
      # models", hard-coded test counts, and performance numbers with no
      # provenance.
      - name: Banned claims absent (zero-RAM, all-models, counts, provenance)
        run: bash tools/docs_claim_check.sh

  # ---------- Android ----------
  android-lint:
    name: Android lint
    runs-on: ubuntu-latest
    # issues: write is only needed for this job: when lint has findings,
    # the check step publishes the report as a PR comment. The workflow
    # token defaults to contents: read only, which 403s on the issues
    # API — without this, the report silently never arrives.
    permissions:
      contents: read
      issues: write
    steps:
      # submodules: true ist Pflicht, keine Optimierung: der native Build
      # ruft add_subdirectory(llama) auf. Ohne Submodul sieht der Job ein
      # leeres Verzeichnis und CMake schlaegt fehl - auf main, bei jedem
      # Release und bei jedem Pull Request, der Android anfasst.
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Toolchain setup moved into .github/actions/setup-android (same
      # pinned, isolated API-34-only SDK the inline step used to build,
      # plus the two-failure-source handling it documents), so this job
      # and the APK job can share ONE cache: the key below is identical
      # in both workflows, and from the second Android job on any day the
      # ~1 GB NDK is a cache hit instead of a download.
      - name: Restore pinned Android SDK + Gradle
        id: sdk-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            $HOME/android-sdk
            $HOME/gradle-dist
          key: android-sdk-${{ runner.os }}-cmdtools-11076708-api-34-buildtools-34.0.0-ndk-26.3.11579264-cmake-3.22.1-gradle-8.7

      - name: Restore Gradle dependency cache
        id: gradle-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.gradle/caches
          key: gradle-deps-${{ runner.os }}-gradle8.7-${{ hashFiles('android/**/*.kts', 'android/**/*.toml', 'android/gradle.properties') }}
          restore-keys: |
            gradle-deps-${{ runner.os }}-gradle8.7-

      - uses: ./.github/actions/setup-android

      - name: Android Lint (must report 0 findings)
        working-directory: android
        run: |
          # Deliberately NOT fatal here: gradle lintDebug aborts on
          # error-level findings but has already written the report.
          # If this step failed the job itself, the next step would be
          # skipped and the report would stay in the UI-only job log.
          # The next step reads the report (or the gradle log tail, if
          # gradle died before the analysis — e.g. a compile error),
          # publishes it where API-only clients can read it, and fails
          # the job itself.
          set +e
          "$GRADLE_BIN" lintDebug --no-daemon -q \
            > "$RUNNER_TEMP/gradle-lint.log" 2>&1
          rc=$?
          set -e
          # The step itself stays green on any rc: the check step is the
          # single failure point, so its diagnostics always run.
          echo "gradle lintDebug exit code: $rc"
          echo "--- last 15 lines of the gradle output ---"
          tail -15 "$RUNNER_TEMP/gradle-lint.log"

      - name: Check the lint report for warnings/errors
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          REPORT=android/app/build/reports/lint-results-debug.txt
          # The job log is only readable in the Actions UI (log-download
          # and artifact hosts are unreachable by API-only clients). So
          # on any failure the diagnostic is published where the API can
          # see it: step summary always, PR comment when the run belongs
          # to a pull request (the number is resolved from the commit
          # SHA when the event itself does not carry one, so push runs
          # that update a PR are covered too).
          FAILED=0
          if [ -f "$REPORT" ] && grep -q "No issues found" "$REPORT"; then
            cat "$REPORT"
          else
            FAILED=1
            {
              echo "### Android Lint report ($(git rev-parse --short HEAD))"
              if [ -f "$REPORT" ]; then
                echo
                echo '```'
                cat "$REPORT"
                echo '```'
              else
                echo
                echo "No report file at \\\`$REPORT\\\` - gradle died before"
                echo "the lint analysis (compile error or toolchain"
                echo "failure). Tail of the gradle output:"
                echo
                echo '```'
                tail -150 "$RUNNER_TEMP/gradle-lint.log"
                echo '```'
              fi
            } > /tmp/lint-report.md
          fi
          if [ "$FAILED" -eq 0 ]; then
            exit 0
          fi
          cat /tmp/lint-report.md
          cat /tmp/lint-report.md >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          # Annotations are the API-readable copy of the findings: posting
          # a PR comment, which the repository token policy can
          # refuse (and has), but workflow commands always land
          # in the check-run's annotations, which the API serves
          # even when the log-download and artifact hosts are
          # unreachable.
          if [ -f "$REPORT" ]; then
            WS="${GITHUB_WORKSPACE%/}" python3 - "$REPORT" << 'PY'
          import os
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse(sys.argv[1]).getroot()
          ws = os.environ.get("WS", "")
          level = {"Error": "error", "Fatal": "error", "Warning": "warning"}
          shown = 0
          total = 0
          for issue in root.iter("issue"):
              if issue.get("severity") == "Ignore":
                  continue
              total += 1
              if shown >= 40:
                  continue
              sev = level.get(issue.get("severity", ""), "warning")
              loc = issue.find("location")
              where = ""
              if loc is not None and loc.get("file"):
                  path = loc.get("file")
                  if ws and path.startswith(ws + "/"):
                      path = path[len(ws) + 1:]
                  where = " file=" + path
                  if loc.get("line"):
                      where += ",line=" + loc.get("line")
              message = " ".join(
                  [issue.get("id", "lint"), issue.get("message", "")]).replace("\n", " ")
              print("::{}{}::{}".format(sev, where, message))
              shown += 1
          if total > shown:
              print("::warning::{} more finding(s) not annotated (cap 40); "
                    "full list in the step summary".format(total - shown))
          PY
          else
            # Same one-annotation pattern as the APK build job:
            # compiler error lines plus a short tail of the gradle
            # log, readable through the check-run annotations API.
            { grep -E "^e: |error:|> Task .* FAILED|BUILD FAILED" \
                "$RUNNER_TEMP/gradle-lint.log" | head -30 | sed 's/^/  /';
              echo "  --- tail ---";
              tail -10 "$RUNNER_TEMP/gradle-lint.log" | sed 's/^/  /'; } \
              | tr '\n' ' ' \
              | sed 's/^/::error::gradle died before the lint analysis: /'
          fi
          PR="${PR_NUMBER:-}"
          if [ -z "$PR" ]; then
            PR="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
                     --jq '.[0].number // empty' 2>/dev/null || true)"
          fi
          if [ -n "$PR" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" \
              -f body="$(cat /tmp/lint-report.md)" >/dev/null 2>&1 \
              || echo "::warning::could not post the lint report as PR comment (check job permissions: issues write)"
          fi
          echo "::error::Android Lint reported findings (or gradle failed before the analysis)"
          exit 1

      - name: Kotlin-/C-Kompilierung (NDK clang ist strenger als Host-gcc)
        working-directory: android
        run: $GRADLE_BIN assembleDebug --no-daemon -q

      # Persist the toolchain for the next Android job (same key as the
      # APK build job, so the two jobs share one warm cache). The
      # dependency cache is saved on success only, same reasoning as
      # there: a failed build must not publish a half-resolved set.
      - name: Save pinned Android SDK + Gradle cache
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            $HOME/android-sdk
            $HOME/gradle-dist
          key: android-sdk-${{ runner.os }}-cmdtools-11076708-api-34-buildtools-34.0.0-ndk-26.3.11579264-cmake-3.22.1-gradle-8.7

      - name: Save Gradle dependency cache
        if: success() && steps.gradle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.gradle/caches
          key: gradle-deps-${{ runner.os }}-gradle8.7-${{ hashFiles('android/**/*.kts', 'android/**/*.toml', 'android/gradle.properties') }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-lint-report
          # The lint report when it exists, plus the published diagnostic
          # payload and the gradle log — everything needed to diagnose a
          # red lint job from a single artifact.
          path: |
            android/app/build/reports/lint-results-debug.txt
            /tmp/lint-report.md
            ${{ runner.temp }}/gradle-lint.log
          if-no-files-found: ignore

  # ---------- Semgrep (Sicherheitsregeln) ----------
  # Befolgt die offizielle CI-Sample-Konfiguration: image ohne Tag,
  # `semgrep ci` beendet sich bei Funden selbst mit Exit 1 (ein
  # the --error flag does not exist). --suppress-errors keeps internal
  # Semgrep errors from blocking the run, real findings still block.
  semgrep:
    name: Semgrep security rules
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - run: semgrep ci --suppress-errors --quiet

  # ---------- CodeQL (C + JavaScript) ----------
  # CodeQL baut das Projekt mit einem eigenen Datenfluss-Graphen und findet
  # exactly the bug class this is about: from the HTTP parameter (model
  # file) down to mmap/open() in C. security-extended goes considerably
  # further than the standard query suite.
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [ 'c-cpp', 'javascript-typescript' ]
    steps:
      - uses: actions/checkout@v4

      # build-mode 'none' for both languages: JavaScript/TypeScript does
      # not support 'autobuild' (fatal error during init), and our C
      # project needs no build step for extraction anyway.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
          build-mode: none

      # The C build runs without CMake anyway, so 'none' is correct here.
      - name: Analyze
        if: matrix.language == 'c-cpp'
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:c-cpp'

      - name: Analyze (JS)
        if: matrix.language == 'javascript-typescript'
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:javascript-typescript'