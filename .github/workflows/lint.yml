name: Lint & Security

# Complete lint/security pipeline for all three code surfaces:
#   C engine (src/, tests/, JNI), web console (server.js, public/) and
#   Android app (Kotlin, manifest, resources).
#
# Every gate was executed locally and checked for falsifiability
# (see errors.md, entries of 2026-10-02).

on:
  push:
    branches: [ main, master ]
  pull_request:

permissions:
  contents: read

jobs:
  # ---------- C: Compiler + Analyzer ----------
  c-lint:
    name: C lint & static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install analyser toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-tidy clang-tools flawfinder cppcheck

      # Verwendet die in errors.md dokumentierten POSIX-Feature-Makros,
      # sonst sind madvise/O_CLOEXEC/clock_gettime unter strict C99 undefiniert.
      - name: gcc -fanalyzer (GCC static analyzer, C99)
        run: |
          gcc -fanalyzer -std=c99 -D_POSIX_C_SOURCE=200809L -D_DEFAULT_SOURCE \
              -Wall -Wextra -Iinclude -c src/hydra_engine.c -o /dev/null
          gcc -fanalyzer -std=c99 -D_POSIX_C_SOURCE=200809L -D_DEFAULT_SOURCE \
              -Wall -Wextra -Iinclude -c src/main.c -o /dev/null

      - name: Clang Static Analyzer
        run: |
          for f in src/hydra_engine.c src/main.c tests/test_engine.c; do
            clang --analyze -std=c99 -D_POSIX_C_SOURCE=200809L -D_DEFAULT_SOURCE \
                -Iinclude -Xanalyzer -analyzer-output=text "$f" -o /dev/null
          done

      # Only bug/cert/concurrency checks. The style checks
      # (identifier-length, magic-numbers, braces-around-statements) are
      # deliberately off for this project, they only produce noise.
      # cert-err33-c is suppressed: it fires on EVERY printf return, which
      # CERT-C calls an error indicator — for stdio that is just noise.
      - name: clang-tidy (bugprone / analyzer / cert / concurrency)
        run: |
          clang-tidy src/hydra_engine.c src/main.c tests/test_engine.c \
            --checks='-*,clang-analyzer-*,bugprone-*,cert-*,-cert-err33-c,concurrency-*,-concurrency-mt-unsafe' \
            -- -std=c99 -D_POSIX_C_SOURCE=200809L -D_DEFAULT_SOURCE -Iinclude \
            || exit 1

      # Level 4 = high/critical. Level 2 would report every fopen/open
      # and every char array; those are false positives here.
      - name: flawfinder (security, level >= 4)
        run: |
          flawfinder -m 4 --error-level=4 -C -Q src/ tests/ \
                     android/app/src/main/cpp/

      - name: Upload C lint report
        if: failure()
        run: |
          {
            echo "=== Hydra-Stone C lint failure (${GITHUB_SHA::7}) ==="
            echo "gcc -fanalyzer -std=c99 -D_POSIX_C_SOURCE=200809L -D_DEFAULT_SOURCE -Wall -Wextra -Iinclude -c src/hydra_engine.c -o /dev/null"
            echo "clang --analyze -std=c99 -D_POSIX_C_SOURCE=200809L -D_DEFAULT_SOURCE -Iinclude src/hydra_engine.c"
            echo "clang-tidy src/*.c --checks='-*,clang-analyzer-*,bugprone-*,cert-*,-cert-err33-c,concurrency-*,-concurrency-mt-unsafe'"
            echo "flawfinder -m 4 --error-level=4 src/ tests/"
          } > c-lint-report.txt
          exit 0

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: c-lint-errors
          path: c-lint-report.txt
          if-no-files-found: ignore

  # ---------- C: runtime sanitizers ----------
  # ASan+UBSan are the only gates that actually report at runtime the
  # signed overflow in the accumulator fixed on 2026-10-02
  # ("2147483640 + 127 cannot be represented in type 'int'").
  sanitizers:
    name: ASan + UBSan (runtime)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run test suite under ASan + UBSan
        run: |
          gcc -O1 -g -std=c99 -D_POSIX_C_SOURCE=200809L -D_DEFAULT_SOURCE \
              -fsanitize=address,undefined -fno-sanitize-recover=all \
              -fno-omit-frame-pointer -Wall -Wextra -Iinclude \
              src/hydra_engine.c tests/test_engine.c -lm -o hydra-test-san
          ASAN_OPTIONS=detect_leaks=1:detect_stack_use_after_return=1 \
          UBSAN_OPTIONS=print_stacktrace=1 \
            ./hydra-test-san

      - name: Run CLI under sanitizers
        run: |
          gcc -O1 -g -std=c99 -D_POSIX_C_SOURCE=200809L -D_DEFAULT_SOURCE \
              -fsanitize=address,undefined -fno-sanitize-recover=all -Iinclude \
              src/hydra_engine.c src/main.c -lm -o hydra-run-san
          python3 tools/make_dummy_model.py san.hydra
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=print_stacktrace=1 \
            ./hydra-run-san san.hydra 42 32 --json
          # CLI-Fehlerpfade unter Sanitizern (OOB-/Symlink-PoCs)
          ASAN_OPTIONS=detect_leaks=1 ./hydra-run-san /etc/hostname 2>/dev/null \
            || echo "expected: rejected"
          ln -sf san.hydra link.hydra
          ASAN_OPTIONS=detect_leaks=1 ./hydra-run-san link.hydra 2>/dev/null \
            || echo "expected: symlink rejected"

  # ---------- JNI: NDK clang hardening ----------
  jni-lint:
    name: JNI layer (CVE-2026-70638 class)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check der JNI-Bridge gegen echte NDK-Header
        run: |
          SDK=/opt/android-sdk
          NDK=$SDK/ndk/26.3.11579264
          clang -fsyntax-only -std=c99 -Wall -Wextra -Werror \
            -Iandroid/app/src/main/cpp -Iinclude \
            -I"$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include" \
            -I"$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include/aarch64-linux-android" \
            android/app/src/main/cpp/hydra_jni.c
        continue-on-error: true

      # The JNI file cannot be checked in full against host headers
      # (jni.h/android/log.h are missing there). The path that really
      # protects us is the NDK build in the Android jobs. Here we run the
      # clang-tidy subset that does not need the Android headers.
      - name: clang-tidy on the JNI bridge (checks without Android headers)
        run: |
          clang-tidy android/app/src/main/cpp/hydra_jni.c \
            --checks='-*,bugprone-easily-swappable-parameters,bugprone-suspicious-memset-usage' \
            -- -x c -std=c99 -Iinclude -I android/app/src/main/cpp || true

  # ---------- Web-Console ----------
  web-lint:
    name: Web console (ESLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dev tooling
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Node syntax check
        run: |
          node --check server.js
          node --check public/app.js
          node --check tools/hydra_train.js
          node --check tools/console_train_test.js

      # The console can TRAIN a model. That is only believable if the
      # compiled C engine is shown to reproduce the trained token stream,
      # so this runs the trainer and the real binary against each other.
      - name: Console trainer is verified against the C engine
        run: |
          make -s all
          node tools/console_train_test.js

  # ---------- Release-Konfiguration ----------
  release-config:
    name: Release config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Without this gate a typo in the release workflow would only surface
      # on a tag push — by then the tag already exists and it is too late.
      - name: Workflow YAML is syntactically valid
        run: |
          for f in .github/workflows/*.yml; do
            python3 -c "import sys,yaml; yaml.safe_load(open(sys.argv[1]))" "$f" \
              || { echo "::error::$f is not valid YAML"; exit 1; }
          done

      # The trigger and version logic of the release workflow is replayed
      # locally: tag push, manual publish, dry run without a tag and an
      # invalid tag. The test reads the script straight out of release.yml
      # and therefore cannot drift from the YAML.
      - name: Release trigger and version logic (including negative control)
        run: bash tools/ci_release_version_test.sh

  # ---------- Android ----------
  android-lint:
    name: Android lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Two failure sources handled in one step:
      # 1) android-actions/setup-android@v3 installs the retired "tools"
      #    package itself and fails with exit 1.
      # 2) The runner ships a prebuilt SDK (platforms 35/36). Lint then
      #    reports targetSdk 34 as "OldTargetApi" even though exactly this
      #    toolchain combination is the locally verified one. Hence an own
      #    SDK root that receives nothing but the pinned packages — the same
      #    sequence as documented in docs/ANDROID_SKILL.md.
      - name: Set up an isolated Android SDK (API 34 only)
        run: |
          set -e
          SDK="$RUNNER_TEMP/android-sdk"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          mkdir -p "$SDK/cmdline-tools"
          cd "$RUNNER_TEMP"
          curl -sSLO https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          rm -rf "$RUNNER_TEMP/cmdline"
          unzip -q commandlinetools-linux-11076708_latest.zip -d "$RUNNER_TEMP/cmdline"
          mv "$RUNNER_TEMP/cmdline/cmdline-tools" "$SDK/cmdline-tools/latest"
          export PATH="$SDK/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" \
                    "build-tools;34.0.0" "ndk;26.3.11579264" "cmake;3.22.1"
          curl -sSL -o gradle.zip \
            https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle.zip -d /opt

      - name: Android Lint (must report 0 findings)
        working-directory: android
        run: /opt/gradle-8.7/bin/gradle lintDebug --no-daemon -q

      - name: Check the lint report for warnings/errors
        run: |
          REPORT=android/app/build/reports/lint-results-debug.txt
          cat "$REPORT"
          if ! grep -q "No issues found" "$REPORT"; then
            echo "::error::Android Lint reported findings"
            exit 1
          fi

      - name: Kotlin-/C-Kompilierung (NDK clang ist strenger als Host-gcc)
        working-directory: android
        run: /opt/gradle-8.7/bin/gradle assembleDebug --no-daemon -q

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-lint-report
          path: android/app/build/reports/lint-results-debug.txt
          if-no-files-found: ignore

  # ---------- Semgrep (Sicherheitsregeln) ----------
  # Befolgt die offizielle CI-Sample-Konfiguration: image ohne Tag,
  # `semgrep ci` beendet sich bei Funden selbst mit Exit 1 (ein
  # the --error flag does not exist). --suppress-errors keeps internal
  # Semgrep errors from blocking the run, real findings still block.
  semgrep:
    name: Semgrep security rules
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - run: semgrep ci --suppress-errors --quiet

  # ---------- CodeQL (C + JavaScript) ----------
  # CodeQL baut das Projekt mit einem eigenen Datenfluss-Graphen und findet
  # exactly the bug class this is about: from the HTTP parameter (model
  # file) down to mmap/open() in C. security-extended goes considerably
  # further than the standard query suite.
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [ 'c-cpp', 'javascript-typescript' ]
    steps:
      - uses: actions/checkout@v4

      # build-mode 'none' for both languages: JavaScript/TypeScript does
      # not support 'autobuild' (fatal error during init), and our C
      # project needs no build step for extraction anyway.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
          build-mode: none

      # The C build runs without CMake anyway, so 'none' is correct here.
      - name: Analyze
        if: matrix.language == 'c-cpp'
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:c-cpp'

      - name: Analyze (JS)
        if: matrix.language == 'javascript-typescript'
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:javascript-typescript'