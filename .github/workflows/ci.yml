name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build-test:
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Build engine + tests
        run: make all && make test

      - name: Run unit tests
        run: ./hydra-test

      - name: Runtime smoke test
        run: |
          python3 tools/make_dummy_model.py smoke.hydra
          ./hydra-run smoke.hydra 42

      - name: Clean up
        run: make clean
