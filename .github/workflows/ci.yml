name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  # ---------- Stage 1: Lint / Syntax (fast, fails first) ----------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install linters
        run: sudo apt-get update -qq && sudo apt-get install -y -qq cppcheck

      # Gate 1a: strict C99 syntax check with POSIX feature macros,
      # all warnings as errors (gcc)
      - name: Syntax check (gcc, C99 strict, -Werror)
        run: |
          gcc -fsyntax-only -std=c99 \
              -D_POSIX_C_SOURCE=200809L -D_DEFAULT_SOURCE \
              -Wall -Wextra -Werror -Iinclude \
              src/hydra_engine.c src/main.c tests/test_engine.c \
              tests/test_jni_batch.c tests/test_large_model.c

      # Gate 1b: same strictness with clang — catches gcc-only
      # diagnostics and validates the code compiles cleanly on a
      # second compiler frontend (double review principle)
      - name: Syntax check (clang, C99 strict, -Werror)
        run: |
          clang -fsyntax-only -std=c99 \
              -D_POSIX_C_SOURCE=200809L -D_DEFAULT_SOURCE \
              -Wall -Wextra -Werror -Iinclude \
              src/hydra_engine.c src/main.c tests/test_engine.c \
              tests/test_jni_batch.c tests/test_large_model.c

      # Gate 1c: static analysis (cppcheck), error-exitcode=2 on any
      # warning/error so nothing slips through
      - name: Static analysis (cppcheck)
        run: |
          cppcheck --enable=warning,portability \
              --inline-suppr --std=c99 --platform=unix64 \
              -Iinclude --error-exitcode=2 \
              src/ tests/

      # Gate 1d: Python syntax + packing consistency of the format
      # reference writer
      - name: Python lint (py_compile + format reference check)
        run: |
          python3 -m py_compile tools/make_model.py
          python3 - << 'EOF'
          import struct, sys
          sys.path.insert(0, 'tools')
          # The header format <IHHIIII> must be exactly 24 bytes to
          # match include/hydra_model.h (checked by C tests too).
          size = struct.calcsize("<IHHIIII")
          assert size == 24, f"Python header size {size} != 24 — format drift!"
          print(f"format check OK: <IHHIIII> = {size} bytes")
          EOF

      # Gate 1e: the packaged model asset must be exactly what the
      # generator produces. It was untracked for a long time, so every
      # CI-built APK shipped without it and only a local build had one.
      - name: Android model asset matches the generator
        run: |
          python3 tools/make_model.py /tmp/demo-check.hydra
          if ! cmp -s /tmp/demo-check.hydra android/app/src/main/assets/starter.hydra; then
            echo "::error::android/app/src/main/assets/starter.hydra differs from tools/make_model.py output"
            exit 1
          fi
          echo "asset matches the generator"

      # On any lint failure, upload the captured diagnostics as a
      # workflow artifact so the error text is attached to the run.
      - name: Upload lint error report
        if: failure()
        run: |
          {
            echo "=== Hydra-Stone lint report (${GITHUB_SHA::7}) ==="
            echo "gcc/clang/cppcheck diagnostics are in the job log above."
            echo "Replicate locally:"
            echo "  gcc -fsyntax-only -std=c99 -D_POSIX_C_SOURCE=200809L -D_DEFAULT_SOURCE \\"
            echo "      -Wall -Wextra -Werror -Iinclude src/hydra_engine.c src/main.c"
            echo "  cppcheck --enable=warning,portability --std=c99 --platform=unix64 \\"
            echo "      -Iinclude --error-exitcode=2 src/ tests/"
          } > lint-report.txt
          exit 0

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: lint-errors
          path: lint-report.txt
          if-no-files-found: ignore

  # ---------- Stage 2a: NEON path on ARM64 (explicit) ----------
  # The NEON kernel shipped with an inverted sign that no existing test
  # could see, because the SIMD path and the scalar path had only ever
  # been compared against fixed expectations — never against each other.
  # This job runs the AArch64 build under qemu so the in-build
  # NEON-vs-scalar comparison (test_neon_matches_scalar) executes on every
  # commit, instead of depending on the macOS runner happening to be ARM64.
  neon-test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install AArch64 cross-compiler and qemu-user
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-12-aarch64-linux-gnu qemu-user-static

      - name: Build + run tests for aarch64 (NEON path active)
        run: |
          aarch64-linux-gnu-gcc-12 -O2 -static -Wall -Wextra \
              -Iinclude \
              src/hydra_engine.c tests/test_engine.c -lm -o hydra-test-arm
          qemu-aarch64-static ./hydra-test-arm

      - name: Cross-arch determinism check (x86 vs ARM/NEON)
        run: |
          make all
          python3 tools/make_model.py parity.hydra
          ./hydra-run parity.hydra 42 8 --json 2>/dev/null > /tmp/x86.json
          aarch64-linux-gnu-gcc-12 -O2 -static -Iinclude \
              src/hydra_engine.c src/main.c -o hydra-run-arm
          qemu-aarch64-static ./hydra-run-arm parity.hydra 42 8 --json \
              2>/dev/null > /tmp/arm.json
          python3 - << 'EOF'
          import json, sys
          x = json.load(open('/tmp/x86.json'))
          a = json.load(open('/tmp/arm.json'))
          print('x86 tokens:', x['tokens'])
          print('arm tokens:', a['tokens'])
          if x['tokens'] != a['tokens'] or x['state'] != a['state']:
              print('FAIL: scalar and NEON paths disagree', file=sys.stderr)
              sys.exit(1)
          print('OK: scalar and NEON paths are bit-identical')
          EOF

      - name: Upload failure logs
        if: failure()
        run: |
          {
            echo "=== Hydra-Stone NEON failure (${GITHUB_SHA::7}) ==="
            echo "Reproduce locally:"
            echo "  aarch64-linux-gnu-gcc-12 -O2 -static -Iinclude \\"
            echo "      src/hydra_engine.c tests/test_engine.c -lm -o hydra-test-arm"
            echo "  qemu-aarch64-static ./hydra-test-arm"
          } > neon-report.txt
          exit 0

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: neon-errors
          path: neon-report.txt
          if-no-files-found: ignore

      - name: Clean up
        if: always()
        run: rm -f hydra-run hydra-test hydra-run-arm hydra-test-arm parity.hydra

  # ---------- Stage 2b: Build + tests (double verification) ----------
  # Every commit is built and tested on two independent runners
  # (linux-gcc + macos-clang) AND two code paths are covered:
  # scalar (x86) and NEON (macOS ARM64 + the dedicated neon-test job).
  build-test:
    needs: lint
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Build engine + tests
        run: make all && make test

      - name: Run unit tests
        run: ./hydra-test

      # The JNI batching policy and the large-model/32-bit arithmetic run
      # on the host, with no device involved. Both are part of `make test`,
      # but they are listed separately here so a failure names the file that
      # broke instead of hiding inside a combined exit code.
      - name: JNI batching policy (partial final block, steps <= 0)
        run: ./jni-batch-test

      # Loads a 5 GiB SPARSE model: the point is that a model bigger than
      # RAM still loads, which is only possible because the mapping is
      # lazy. Sparse keeps it at a few KiB of real disk.
      - name: Large models and 32-bit offset arithmetic
        run: ./large-model-test

      - name: Runtime smoke test
        run: |
          python3 tools/make_model.py smoke.hydra
          ./hydra-run smoke.hydra 42

      # The prompt path (--prompt) is what the web console and the Android
      # app depend on: the whole message has to reach the engine, not just
      # its first token. A regression there is silent - the console still
      # answers, just with the wrong prompt - so it is asserted here, with
      # a negative control that the malformed cases are rejected.
      - name: Prompt prefill reaches the engine (with negative control)
        run: |
          set -euo pipefail
          python3 tools/make_model.py prompt.hydra
          single=$(./hydra-run prompt.hydra 7 4 --json 2>/dev/null)
          p1=$(./hydra-run prompt.hydra 0 4 --prompt 7 --json 2>/dev/null)
          p3=$(./hydra-run prompt.hydra 0 4 --prompt 3,5,7 --json 2>/dev/null)
          python3 - "$single" "$p1" "$p3" <<'EOF'
          import json, sys
          bare, one, three = (json.loads(a) for a in sys.argv[1:4])
          assert one["tokens"] == bare["tokens"], "prompt [7] must equal seed 7"
          assert three["tokens"] != bare["tokens"], "a longer prompt must change the output"
          assert three["prompt"] == [3, 5, 7], f"prompt not echoed back: {three['prompt']}"
          print("ok: prompt [7] == seed 7, prompt [3,5,7] changes the stream")
          EOF
          # Negative control: a malformed prompt must be refused, not capped.
          for bad in "3,abc" "3," ""; do
            if ./hydra-run prompt.hydra --prompt "$bad" --json >/dev/null 2>&1; then
              echo "::error::malformed --prompt '$bad' was accepted"
              exit 1
            fi
          done
          if ./hydra-run prompt.hydra --prompt --json >/dev/null 2>&1; then
            echo "::error::--prompt without an argument was accepted"
            exit 1
          fi
          echo "ok: malformed prompts are rejected"

      - name: Upload failure logs
        if: failure()
        run: |
          {
            echo "=== Hydra-Stone build/test failure (${GITHUB_SHA::7}, ${{ matrix.os }}) ==="
            echo "Rerun locally: make all && make test && ./hydra-test"
          } > failure-report-${{ matrix.os }}.txt
          exit 0

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-errors-${{ matrix.os }}
          path: failure-report-${{ matrix.os }}.txt
          if-no-files-found: ignore

      - name: Clean up
        run: make clean

  # ---------- Stage 2c: GPU benchmark still builds and still measures ----
  # tools/gpu_bench/ used to depend on a precompiled SPIR-V blob that
  # nothing in the build produced, so it could not run anywhere. It now
  # compiles its GLSL at runtime, and this job keeps the CPU reference
  # path honest on every push: it must build with -Werror and emit valid
  # JSON for both the CPU line and the explicit "no GPU here" line.
  gpu-bench:
    name: GPU bench (CPU reference)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and run the CPU reference
        run: make -s gpu-bench

      - name: The JSON contract must hold
        run: |
          set -euo pipefail
          out="$(./gpu_bench_cpu --dim 64 --layers 4 --k 1,16,64 --steps 500)"
          echo "$out"
          echo "$out" | python3 -c '
          import json, sys
          lines = [l for l in sys.stdin.read().splitlines() if l.strip()]
          objs = [json.loads(l) for l in lines]
          cpu = [o for o in objs if o.get("device") == "cpu"]
          gpu = [o for o in objs if o.get("device") == "gpu"]
          assert cpu, "no CPU measurement"
          assert cpu[0]["measured"] is True, "the CPU line must claim to be measured"
          assert cpu[0]["ns_per_step"] > 0, "a measurement must be positive"
          assert gpu, "there must be an explicit GPU line"
          # No GPU on a CI runner: the line must SAY so instead of
          # pretending or crashing.
          assert gpu[0]["measured"] is False
          assert "reason" in gpu[0]
          print("ok: cpu measured, gpu explicitly skipped with a reason")
          '

      - name: Clean up
        run: make -s clean

  # ---------- Stage 3a: JNI bridge verified by javac ----------
  # The Kotlin bridge declares `external fun` methods; the C file must
  # export the matching JNI symbols. `javac -h` derives the symbol names
  # and signatures straight from the Kotlin declarations, so this gate
  # cannot drift from the actual bridge API. Proven to fail: a bridge
  # with one unimplemented method makes the check exit 1.
  jni-signatures:
    name: JNI bridge (javac)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Every native method must exist in the C bridge
        run: bash tools/jni_signature_check.sh

      # The crash-reporting contract cannot be executed without a device,
      # but the properties that were the bugs can be: the handler writes
      # the file BEFORE delegating, never starts an Activity, the report is
      # surfaced on the next launch, and steps <= 0 is rejected instead of
      # clamped. Each check fails when the property is removed.
      - name: Crash reporting and cancel contract
        run: bash tools/android_crash_check.sh

      # Same idea for the model header check: the Android import must apply
      # the same rules as the C loader and the web console, name the format
      # the user actually picked (GGUF), and add offsets in 64 bits.
      - name: Android model header diagnostics
        run: bash tools/android_header_check.sh

      # The app must actually start by itself, and the starter model it
      # ships must be a real file that git is willing to track. That second
      # half is the reason this runs in CI and not only locally: the asset
      # was once renamed while .gitignore still ignored *.hydra, so every
      # developer build had it and no fresh checkout did.
      - name: Android autostart and packaged starter model
        run: bash tools/android_autostart_check.sh

  # ---------- Stage 3b: the APK is built on every push ----------
  # Previously the APK was only built by the release workflow, i.e. only
  # on a tag. main therefore never proved that the app still builds.
  # This job builds it on every push and pull request, verifies the
  # signature and the packaged native libraries, and attaches the APK as
  # a workflow artifact.
  android-apk:
    name: Android APK build
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: ./.github/actions/setup-android

      - name: Derive version from the commit
        run: |
          echo "HYDRA_VERSION_NAME=ci.${{ github.run_number }}.${{ github.sha }}" >> "$GITHUB_ENV"
          echo "HYDRA_VERSION_CODE=$(( 900000 + ${{ github.run_number }} ))" >> "$GITHUB_ENV"

      # Without a keystore secret (every pull request) the release build
      # falls back to the debug key, so this job always produces an APK.
      - name: Build debug and release APK (Kotlin + NDK C via CMake)
        working-directory: android
        run: $GRADLE_BIN assembleDebug assembleRelease --no-daemon

      - name: Verify signature, ABIs and asset
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          BT="$ANDROID_HOME/build-tools/34.0.0"
          "$BT/apksigner" verify --print-certs "$APK"
          "$BT/aapt" dump badging "$APK" \
            | grep -E "^package:|^sdkVersion:|^application-label:"
          # Two independent listings: aapt (what the packager thinks it
          # shipped) and unzip (what is really in the archive). A gate
          # that only trusts one tool cannot tell a packaging bug from a
          # listing bug.
          "$BT/aapt" list "$APK" > apk-contents.txt
          unzip -l "$APK" | awk '{print $NF}' | grep -E '^(lib|assets)/' > apk-unzip.txt
          echo "--- aapt listing ---";  cat apk-contents.txt | grep -E '^(lib|assets)/' || true
          echo "--- unzip listing ---"; cat apk-unzip.txt || true
          for abi in arm64-v8a armeabi-v7a x86_64; do
            if ! grep -q "lib/$abi/libhydra.so" apk-unzip.txt; then
              echo "::error::libhydra.so missing for $abi"
              exit 1
            fi
          done
          grep -q 'assets/starter.hydra' apk-unzip.txt

          # Permission gate: the app opens files through the Storage
          # Access Framework, which needs NO permission at all. Any
          # dangerous permission that shows up here is either a dependency
          # asking for something the app never uses, or something we added
          # on purpose — either way it must be a decision, not a surprise.
          "$BT/aapt" dump permissions "$APK" > apk-permissions.txt
          echo "--- requested permissions ---"; cat apk-permissions.txt
          for dangerous in INTERNET READ_EXTERNAL_STORAGE WRITE_EXTERNAL_STORAGE \
                           MANAGE_EXTERNAL_STORAGE RECORD_AUDIO CAMERA \
                           ACCESS_FINE_LOCATION READ_PHONE_STATE; do
            if grep -q "android.permission.$dangerous" apk-permissions.txt; then
              echo "::error::the APK requests $dangerous - SAF needs no permission"
              exit 1
            fi
          done
          echo "ok: no dangerous permission is requested"
          mkdir -p dist
          cp "$APK" "dist/hydra-stone-ci-${{ github.run_number }}.apk"
          sha256sum "dist/hydra-stone-ci-${{ github.run_number }}.apk" | tee dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hydra-stone-apk-ci
          path: dist/
          if-no-files-found: error
          retention-days: 14
