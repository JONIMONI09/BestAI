# Issue verification & auto-close.
#
# The research conclusion behind this workflow (web research 2024-2026):
# GitHub's native "Closes #N" keyword closes an issue when the PR that
# implemented it is MERGED - that is the right mechanism for feature
# issues and needs no automation at all (the convention is documented in
# AGENTS.md). What the native keyword cannot do is PROVE the
# implementation: nothing stops a merge with "Closes #N" while the
# feature is half done. So this workflow carries the proof half:
#
#   .github/issue-verifications.yml maps issue numbers to the shell
#   gate(s) that demonstrate the issue is implemented (the crash guard,
#   the test suite, ...). On every push to main (plus manual dispatch)
#   tools/issue_verify.py runs those gates and closes the issue - with
#   a comment linking the proving commit and run - ONLY when every gate
#   exits 0. A failing gate closes nothing and makes this run red; an
#   already-closed issue is skipped, so re-runs stay green.
#
# Only issues the maintainer listed are ever touched: there is no bulk
# logic, and every auto-close is auditable through its comment.

name: Issue verification & auto-close

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  verify:
    name: Verify mapped issues on main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # PyYAML is optional (the tool's flat fallback parser is the
      # contract); when it can be installed quickly the real parser is
      # used, otherwise the fallback. A pip failure must not fail the
      # run: the gates are the point, not the parser.
      - name: Install PyYAML (optional)
        run: python3 -m pip install --quiet --disable-pip-version-check pyyaml || echo "PyYAML unavailable - fallback parser will be used"

      - name: Verify and auto-close
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 tools/issue_verify.py
