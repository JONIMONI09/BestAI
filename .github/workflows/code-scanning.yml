# Code scanning alert handling.
#
# Owner rule (2026-10-26): CI reacts to CODE SCANNING results - not to
# issues. This workflow therefore carries NO hardcoded results: no rule
# lists, no issue numbers, no gate mappings, no expected counts. Every
# fact it reports (rule id, file, line, message, commit, alert URL) is
# read at run time from the code_scanning_alert event payload that
# GitHub delivers with the run.
#
# Lifecycle:
#   1. A scanner (CodeQL, Semgrep, ...) reports a finding on some commit
#      -> GitHub creates a code-scanning alert -> this workflow runs.
#   2. The alert is reported where the author can act: as a PR comment
#      when the alert's commit belongs to an open PR of this repository,
#      otherwise into the job summary (a push to main has no PR).
#   3. The alert closes ITSELF: GitHub resolves a code-scanning alert as
#      "fixed" when the next analysis of the default branch no longer
#      reports it - i.e. the fix commit that makes the finding disappear
#      also closes the alert, autonomously, with no manual action and no
#      issue to track.
name: Code scanning alert handling

on:
  code_scanning_alert:
    types: [created]

permissions:
  contents: read
  pull-requests: write

jobs:
  report:
    name: Report the alert
    runs-on: ubuntu-latest
    steps:
      - name: Deliver the alert report (PR comment or job summary)
        env:
          ALERT: ${{ toJSON(github.event.alert) }}
          REPO: ${{ github.repository }}
          REPO_OWNER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # --- Read everything from the event payload (nothing hardcoded) ---
          num=$(jq -r '.number' <<<"$ALERT")
          rule=$(jq -r '.rule_id' <<<"$ALERT")
          ref=$(jq -r '.ref' <<<"$ALERT")
          sha=$(jq -r '.commit_sha' <<<"$ALERT")
          alert_url=$(jq -r '.html_url' <<<"$ALERT")
          path=$(jq -r '.most_recent_instance.location.path // "unknown"' <<<"$ALERT")
          line=$(jq -r '.most_recent_instance.location.start_line // empty' <<<"$ALERT")
          title=$(jq -r '.most_recent_instance.message.annotations[0].title // empty' <<<"$ALERT")
          msg=$(jq -r '.most_recent_instance.message.annotations[0].message // empty' <<<"$ALERT")

          body="## Code scanning alert ${num}: \`${rule}\`
          <!-- code-scanning-alert-${num} -->

          - **Location:** \`${path}${line:+:${line}}\` on \`${sha:0:7}\`
          - **Alert:** [security/code-scanning/${num}](${alert_url})
          ${title:+- **Title:** ${title}
          }${msg:+- **Message:**
            ${msg}
          }

          This comment was posted automatically by the
          *Code scanning alert handling* workflow. The alert closes
          **itself** as *fixed* once the next CodeQL/Semgrep analysis no
          longer reports it - a fix commit that makes the finding
          disappear also closes the alert, no manual action needed."

          # --- Deliver: PR comment if the commit belongs to an open PR ---
          branch="${ref#refs/heads/}"
          pr_num=""
          if [ "$branch" != "$ref" ]; then
            pr_num=$(gh api "repos/${REPO}/pulls?head=${REPO_OWNER}:${branch}&state=open" \
                       --jq '.[0].number // empty' 2>/dev/null || true)
          fi

          if [ -n "$pr_num" ]; then
            # De-duplicate: a marker comment for this alert number
            # already present means we reported it (e.g. the alert was
            # re-created after a flaky re-analysis).
            already=$(gh api "repos/${REPO}/issues/${pr_num}/comments?per_page=100" \
                        --jq '.[].body' 2>/dev/null \
                        | grep -cF "<!-- code-scanning-alert-${num} -->" || true)
            if [ "${already:-0}" -gt 0 ]; then
              echo "alert ${num} already reported on PR #${pr_num} - skipping"
            else
              gh pr comment "${pr_num}" --body "$body"
              echo "alert ${num} reported on PR #${pr_num}"
            fi
          else
            # No PR (push to main/master, merged branch): job summary.
            printf '%s\n' "$body" >> "$GITHUB_STEP_SUMMARY"
            echo "alert ${num} has no open PR - report written to the job summary"
          fi
