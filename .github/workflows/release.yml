name: Release

# Creates a GitHub Release from a git tag (v*.*.*) containing:
#   - hydra-run for linux-x64, linux-arm64 and macos-arm64
#   - an installable, signed Android APK (arm64-v8a, armeabi-v7a, x86_64)
#   - SHA256 checksums for every artifact
#
# Without extra secrets the APK is immediately installable (debug
# signature). If the HYDRA_KEYSTORE* secrets are set, it is signed with
# a real release key and the release body says so.
#
# Three triggers:
#   1. push to main          -> THE AUTOMATIC RELEASE. Every time main
#      changes the workflow decides on its own whether the current main
#      commit already has a release:
#        * no tag yet             -> creates the next version tag
#        * tag exists, release    -> updates it: rebuilds every artifact
#          missing or outdated       and re-uploads (--clobber)
#        * release exists, no     -> (re)creates the release
#          tag
#        * tag points at an older -> creates a new, higher version tag
#          commit
#      This is idempotent: a second run without a new commit finds the
#      release complete and does nothing.
#   2. push of a v*.*.* tag  -> builds and publishes that exact tag
#   3. workflow_dispatch      -> manual build without a tag push. With no
#      tag input this is a pure dry run: all five jobs build (including
#      APK signature verification and NDK/JNI compilation) but nothing is
#      published. With a tag and publish=true the run behaves exactly
#      like a tag push. That makes the release chain testable without
#      pushing a tag every time.

on:
  push:
    branches: [ 'main' ]
    tags: [ 'v*.*.*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (vMAJOR.MINOR.PATCH). Empty = build-only dry run.'
        required: false
        type: string
      publish:
        description: 'Create the GitHub Release (ignored without a tag)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      version_code: ${{ steps.v.outputs.version_code }}
      publish: ${{ steps.v.outputs.publish }}
      create_tag: ${{ steps.v.outputs.create_tag }}
      create_release: ${{ steps.v.outputs.create_release }}
    steps:
      # Alle Tags des Repos, eine Zeile pro Tag: "v1.2.3 <sha>".
      # Wird fuer den main-Push gebraucht, um festzustellen, ob es
      # ueberhaupt schon eine Version gibt und auf welchem Commit sie steht.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: List existing version tags
        id: t
        run: |
          set -euo pipefail
          {
            echo "list<<EOF"
            git ls-remote --tags --refs origin \
              | awk '{print $2, $1}' | sed 's#refs/tags/##' || true
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Werte kommen ueber env, nicht per ${{ }} im Skript: sonst wuerde ein
      # frei eingegebener Tag als Shell-Code ausgefuehrt (Script Injection).
      - name: Derive version from tag
        id: v
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          HEAD_SHA: ${{ github.sha }}
          TAG_LIST: ${{ steps.t.outputs.list }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail

          CREATE_TAG=false
          CREATE_RELEASE=false

          if [ "$EVENT" = "push" ] && [ "$REF_TYPE" = "branch" ]; then
            # ---- Automatic release on every push to main -------------
            # Hoechste existierende vMAJOR.MINOR.PATCH bestimmen. Nur
            # streng numerische Tags zaehlen; "v0.0.0-ci.<run>" ist eine
            # Dry-Run-Marke und darf nie zur Basis werden.
            BEST=""; BEST_SHA=""
            # Pro Zeile genau ein Tag: read -r name sha wuerde den Rest
            # einer Zeile in sha schieben und die Folgezeilen verschlucken.
            while read -r line; do
              [ -n "${line:-}" ] || continue
              name="${line%% *}"; sha="${line##* }"
              [ "$name" = "$sha" ] && sha=""
              [[ "$name" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || continue
              cur="${name#v}"
              if [ -z "$BEST" ]; then BEST="$name"; BEST_SHA="$sha"; continue; fi
              # semver-Vergleich ohne sort -V (nicht ueberall gleich)
              IFS=. read -r bm bi bp <<< "${BEST#v}"
              IFS=. read -r cm ci cp <<< "$cur"
              if [ "$cm" -gt "$bm" ] || { [ "$cm" -eq "$bm" ] && [ "$ci" -gt "$bi" ]; } \
                 || { [ "$cm" -eq "$bm" ] && [ "$ci" -eq "$bi" ] && [ "$cp" -gt "$bp" ]; }; then
                BEST="$name"; BEST_SHA="$sha"
              fi
            done <<< "$TAG_LIST"

            if [ -z "$BEST" ]; then
              TAG="v1.0.0"
              CREATE_TAG=true
              CREATE_RELEASE=true
              echo "::notice::No version tag exists - creating $TAG for main@${HEAD_SHA:0:7}"
            elif [ "$BEST_SHA" = "$HEAD_SHA" ]; then
              # Tag steht bereits auf diesem main-Commit: Release
              # existiert oder wird erzwungen neu aufgebaut und
              # hochgeladen (upsert, s.u.). Kein neuer Tag noetig.
              TAG="$BEST"
              CREATE_TAG=false
              CREATE_RELEASE=true
              echo "::notice::$TAG already points at main@${HEAD_SHA:0:7} - release will be created or updated"
            else
              IFS=. read -r bm bi bp <<< "${BEST#v}"
              TAG="v${bm}.${bi}.$(( bp + 1 ))"
              CREATE_TAG=true
              CREATE_RELEASE=true
              echo "::notice::$TAG is on ${BEST_SHA:0:7}, main is ${HEAD_SHA:0:7} - creating $TAG"
            fi
            PUBLISH=true
          elif [ "$EVENT" = "push" ]; then
            TAG="$REF_NAME"
            PUBLISH=true
          else
            TAG="${INPUT_TAG:-}"
            PUBLISH="${INPUT_PUBLISH:-false}"
            if [ -z "$TAG" ]; then
              # Dry-Run: synthetisches Tag, kein Push noetig, nichts publiziert.
              TAG="v0.0.0-ci.${RUN_NUMBER}"
              PUBLISH=false
              echo "::notice::No tag given - dry run with ${TAG}. No release will be published."
            fi
          fi

          V="${TAG#v}"
          if [[ ! "$V" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
            echo "::error::Tag '${TAG}' does not match vMAJOR.MINOR.PATCH"
            exit 1
          fi
          MAJ="${BASH_REMATCH[1]}"; MIN="${BASH_REMATCH[2]}"; PAT="${BASH_REMATCH[3]}"
          CODE=$(( MAJ * 10000 + MIN * 100 + PAT ))
          if [ "$CODE" -lt 1 ]; then CODE=1; fi

          echo "tag=$TAG"      >> "$GITHUB_OUTPUT"
          echo "version=$V"    >> "$GITHUB_OUTPUT"
          echo "version_code=$CODE" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "create_tag=$CREATE_TAG" >> "$GITHUB_OUTPUT"
          echo "create_release=$CREATE_RELEASE" >> "$GITHUB_OUTPUT"
          echo "Release ${TAG} -> versionCode ${CODE}, publish=${PUBLISH}"

  # Legt den Tag an, den der main-Push gerade berechnet hat. Der Push
  # erfolgt bewusst ueber die GitHub-Refs-API und nicht ueber "git push":
  # ein Token-Push loest keinen weiteren push:-Tags-Workflow aus, sonst
  # laeuft derselbe Build doppelt.
  ensure-tag:
    name: Create version tag
    needs: version
    if: needs.version.outputs.create_tag == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Checkout persistiert die Repository-Credentials, deshalb reicht
      # ein normaler Push. Ein Push mit diesem Token loest keinen weiteren
      # push:-Tags-Workflow aus - der Build laeuft genau einmal.
      - name: Point the tag at this commit (idempotent)
        env:
          TAG: ${{ needs.version.outputs.tag }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::notice::Tag $TAG already exists - keeping it"
            exit 0
          fi
          git tag -f "$TAG" "$SHA"
          git push origin "refs/tags/$TAG"
          echo "::notice::Created tag $TAG on ${SHA:0:7}"

  build-linux:
    name: CLI (Linux)
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cross toolchain + qemu
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-12-aarch64-linux-gnu qemu-user-static

      - name: Build linux-x64
        run: |
          make clean && make
          mkdir -p dist
          cp hydra-run dist/hydra-run-linux-x64
          strip dist/hydra-run-linux-x64

      - name: Build linux-arm64 (static)
        run: |
          aarch64-linux-gnu-gcc-12 -O3 -static -Wall -Wextra \
              -Iinclude src/hydra_engine.c src/main.c -lm -o dist/hydra-run-linux-arm64

      # Beide Binaries MUESSEN dasselbe Ergebnis liefern wie der skalare
      # Host — sonst waere die NEON-Gleichheitsaussage wieder unbelegt.
      - name: Verify x64 vs arm64 parity
        run: |
          python3 tools/make_model.py parity.hydra
          ./dist/hydra-run-linux-x64 parity.hydra 42 8 --json 2>/dev/null > /tmp/x64.json
          qemu-aarch64-static ./dist/hydra-run-linux-arm64 parity.hydra 42 8 --json \
              2>/dev/null > /tmp/arm.json
          python3 - << 'EOF'
          import json, sys
          a = json.load(open('/tmp/x64.json')); b = json.load(open('/tmp/arm.json'))
          print('x64:', a['tokens']); print('arm:', b['tokens'])
          if a['tokens'] != b['tokens'] or a['state'] != b['state']:
              print('FAIL: scalar and NEON release binaries disagree', file=sys.stderr)
              sys.exit(1)
          print('OK: release binaries are bit-identical across architectures')
          EOF

      - name: Checksums
        working-directory: dist
        run: sha256sum hydra-run-linux-* > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: hydra-stone-linux
          path: dist/

  build-macos:
    name: CLI (macOS arm64)
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with clang (ARM64, NEON-Pfad aktiv)
        run: |
          mkdir -p dist
          clang -O3 -Wall -Wextra -Iinclude \
              src/hydra_engine.c src/main.c -lm -o dist/hydra-run-macos-arm64
      - name: Smoke test on the release binary
        run: |
          python3 tools/make_model.py smoke.hydra
          ./dist/hydra-run-macos-arm64 smoke.hydra 42 8 --json 2>/dev/null | head -c 160
          echo
      - name: Checksums
        working-directory: dist
        run: shasum -a 256 hydra-run-macos-arm64 > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: hydra-stone-macos
          path: dist/

  build-android:
    name: Android APK
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Gleiche Reihenfolge wie in lint.yml: eigenes SDK-Root, cmdline-tools
      # explizit installieren (android-actions/setup-android scheitert am
      # nicht mehr existierenden Paket "tools") und ausschliesslich die
      # gepinnten Pakete laden, damit der Release-Build exakt der lokal
      # verifizierten Toolchain entspricht.
      - name: Android SDK isoliert aufsetzen (nur API 34)
        run: |
          set -e
          SDK="$RUNNER_TEMP/android-sdk"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          mkdir -p "$SDK/cmdline-tools"
          cd "$RUNNER_TEMP"
          curl -sSLO https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          rm -rf "$RUNNER_TEMP/cmdline"
          unzip -q commandlinetools-linux-11076708_latest.zip -d "$RUNNER_TEMP/cmdline"
          mv "$RUNNER_TEMP/cmdline/cmdline-tools" "$SDK/cmdline-tools/latest"
          export PATH="$SDK/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" \
                    "build-tools;34.0.0" "ndk;26.3.11579264" "cmake;3.22.1"
          curl -sSL -o gradle.zip \
            https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle.zip -d /opt

      - name: Build APK
        working-directory: android
        env:
          HYDRA_VERSION_NAME: ${{ needs.version.outputs.version }}
          HYDRA_VERSION_CODE: ${{ needs.version.outputs.version_code }}
          HYDRA_KEYSTORE: ${{ secrets.HYDRA_KEYSTORE_BASE64 }}
          HYDRA_KEYSTORE_PASSWORD: ${{ secrets.HYDRA_KEYSTORE_PASSWORD }}
          HYDRA_KEY_ALIAS: ${{ secrets.HYDRA_KEY_ALIAS }}
          HYDRA_KEY_PASSWORD: ${{ secrets.HYDRA_KEY_PASSWORD }}
        run: |
          mkdir -p ../dist
          if [ -n "${HYDRA_KEYSTORE//[[:space:]]/}" ]; then
            echo "$HYDRA_KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "HYDRA_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No keystore secret set - the APK is shipped debug-signed (installable, not Play-Store-ready)."
          fi
          /opt/gradle-8.7/bin/gradle assembleRelease --no-daemon -q
          /opt/gradle-8.7/bin/gradle assembleDebug   --no-daemon -q
          cp app/build/outputs/apk/release/app-release.apk \
             "../dist/hydra-stone-${{ needs.version.outputs.version }}-android-arm64v8a-armeabiv7a-x86_64.apk"
          cp app/build/outputs/apk/debug/app-debug.apk ../dist/hydra-stone-debug.apk

      # Without this check an unsigned or incomplete APK could end up as a
      # release artifact.
      - name: Verify the APK is signed, complete and installable
        run: |
          APK="dist/hydra-stone-${{ needs.version.outputs.version }}-android-arm64v8a-armeabiv7a-x86_64.apk"
          test -f "$APK"
          # Paths relative to the isolated SDK root (ANDROID_HOME is set via
          # GITHUB_ENV in the SDK step) - no hardcoded /opt/android-sdk,
          # which does not exist on the runner.
          BT="$ANDROID_HOME/build-tools/34.0.0"
          test -x "$BT/apksigner" || { echo "::error::apksigner is missing"; exit 1; }
          "$BT/apksigner" verify --print-certs "$APK"
          "$BT/aapt" list "$APK" > apk-contents.txt
          for abi in arm64-v8a armeabi-v7a x86_64; do
            grep -q "lib/$abi/libhydra.so" apk-contents.txt || {
              echo "::error::libhydra.so missing for $abi"; exit 1; }
          done
          grep -q 'assets/starter.hydra' apk-contents.txt
          "$BT/aapt" dump badging "$APK" \
            | grep -E "^package:|^sdkVersion:|^application-label:"
      - name: Android Lint must be error-free
        working-directory: android
        run: |
          /opt/gradle-8.7/bin/gradle lintDebug --no-daemon -q
          REPORT=app/build/reports/lint-results-debug.txt
          cat "$REPORT"
          grep -q "No issues found" "$REPORT"
      - name: Checksums
        working-directory: dist
        run: sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: hydra-stone-android
          path: dist/

  publish:
    name: Publish GitHub Release
    needs: [ version, build-linux, build-macos, build-android ]
    # In a manual dry run nothing is published - the four build jobs still
    # run to completion.
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: hydra-stone-*
          path: dist
          merge-multiple: true

      - name: Combined checksum list
        run: |
          cd dist
          sha256sum $(ls | grep -v SHA256SUMS) > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Der Release-Text wird als Datei geschrieben und dann per gh-CLI
      # hochgeladen. Das ist der entscheidende Schritt fuer "aktualisieren
      # statt neu anlegen": gh release upload --clobber ersetzt jedes
      # vorhandene Asset gleichen Namens, und gh release edit aktualisiert
      # Titel/Text, ohne dass der Release geloescht werden muss.
      # Quoted heredoc ('EOF'): Backticks und $ im Markdown koennen so
      # nicht als Shell-Code interpretiert werden. Versionsangaben kommen
      # aus env, nicht aus ${{ }} (Script-Injection-Schutz).
      - name: Release notes
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          cat > notes.md <<'EOF'
            ## Hydra-Stone $TAG

            ### Android APK - directly installable

            | File | Contents |
            |---|---|
            | `hydra-stone-*-android-*.apk` | Release-Build, arm64-v8a + armeabi-v7a + x86_64 |
            | `hydra-stone-debug.apk` | Debug-Build, identischer Code |

            Install via sideload (Android 7.0 / API 24 or newer):

            ```bash
            # Option A: on the phone - download the APK, tap it and allow
            #            "Unknown sources" for the browser
            # Option B: via adb
            adb install -r hydra-stone-*-android-*.apk
            ```

            Contains `libhydra.so` for all three ABIs (the C engine itself,
            NEON path on ARM), `assets/starter.hydra` and the launcher icon. The
            app runs an inference on startup and shows the token stream live.

            ### CLI

            | File | Platform |
            |---|---|
            | `hydra-run-linux-x64` | Linux x86-64, statically linked |
            | `hydra-run-linux-arm64` | Linux ARM64 (AArch64), statically linked |
            | `hydra-run-macos-arm64` | macOS Apple Silicon (clang, NEON enabled) |

            ```bash
            python3 tools/make_model.py starter.hydra
            ./hydra-run-linux-x64 starter.hydra 42 8 --json
            ```

            The x64 and arm64 binaries are checked against each other before
            the release: they must produce bit-identical token **and** state
            vectors. A release with differing results is never created.

            ### Integrity

            ```
            sha256sum -c SHA256SUMS.txt
            ```

            ### What was verified before this release

            - **C:** gcc-strict, clang-strict, GCC `-fanalyzer`, Clang Static
              Analyzer, clang-tidy (bugprone/cert/concurrency), cppcheck,
              flawfinder (Schwelle 4)
            - **C runtime:** full test suite under AddressSanitizer +
              UndefinedBehaviorSanitizer
            - **NEON:** ARM64 build under qemu; token and state vectors
              bit-identical to the scalar path
            - **Web:** ESLint 10 on server and frontend
            - **Android:** Android Lint with 0 findings, NDK clang build for 3 ABIs
            - **JNI:** `javac -h` header check against the C bridge

            ### Signature note

            If this release was built without a stored keystore secret, the APK
            is signed with the debug key: fully installable, but not suitable
            for the Google Play Store. For Play Store releases store
            `HYDRA_KEYSTORE_BASE64`, `HYDRA_KEYSTORE_PASSWORD`, `HYDRA_KEY_ALIAS`
            and `HYDRA_KEY_PASSWORD` as repository secrets.
          EOF
          head -3 notes.md

      # Idempotenter Upsert. Genau diese Abfrage entscheidet zwischen
      # "create" und "update" - und sie fragt die Release-API ab, nicht
      # irgendeinen lokalen Zustand:
      #   * Release existiert nicht -> create (mit Target-Commit)
      #   * Release existiert        -> edit (Titel/Text) + upload --clobber
      # Der abschliessende Check beweist, dass danach wirklich alle
      # erwarteten Assets haengen; ein Release ohne APK waere ein Fehler,
      # kein Erfolg.
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
          SHA: ${{ github.sha }}
          CREATE: ${{ needs.version.outputs.create_release }}
        run: |
          set -euo pipefail
          NOTES="$GITHUB_WORKSPACE/notes.md"
          test -f "$NOTES"
          cd dist
          shopt -s nullglob
          ASSETS=(*.apk hydra-run-linux-x64 hydra-run-linux-arm64 \
                  hydra-run-macos-arm64 SHA256SUMS.txt)
          if [ "${#ASSETS[@]}" -eq 0 ]; then
            echo "::error::no artifacts to publish"
            exit 1
          fi
          echo "Publishing ${#ASSETS[@]} assets for $TAG"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::Release $TAG exists - updating it"
            gh release edit "$TAG" --title "Hydra-Stone $TAG" \
               --notes-file "$NOTES" --draft=false --prerelease=false
          else
            echo "::notice::Release $TAG does not exist - creating it"
            gh release create "$TAG" --title "Hydra-Stone $TAG" \
               --notes-file "$NOTES" --target "$SHA" \
               --draft=false --prerelease=false
          fi

          gh release upload "$TAG" "${ASSETS[@]}" --clobber

      - name: Verify the published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          NAMES="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          echo "$NAMES"
          for want in SHA256SUMS.txt hydra-run-linux-x64 hydra-run-linux-arm64 \
                     hydra-run-macos-arm64 hydra-stone-debug.apk; do
            grep -qx "$want" <<< "$NAMES" || {
              echo "::error::release $TAG is missing asset $want"
              exit 1
            }
          done
          grep -q -- '-android-.*\.apk$' <<< "$NAMES" || {
            echo "::error::release $TAG has no release APK"
            exit 1
          }
          echo "::notice::Release $TAG is complete"