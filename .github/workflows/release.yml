name: Release

# Creates a GitHub Release from a git tag (v*.*.*) containing:
#   - hydra-run for linux-x64, linux-arm64 and macos-arm64
#   - an installable, signed Android APK (arm64-v8a, armeabi-v7a, x86_64)
#   - SHA256 checksums for every artifact
#
# Without extra secrets the APK is immediately installable (debug
# signature). If the HYDRA_KEYSTORE* secrets are set, it is signed with
# a real release key and the release body says so.
#
# Two triggers:
#   1. push of a v*.*.* tag  -> builds and publishes the release
#   2. workflow_dispatch      -> manual build without a tag push. With no
#      tag input this is a pure dry run: all five jobs build (including
#      APK signature verification and NDK/JNI compilation) but nothing is
#      published. With a tag and publish=true the run behaves exactly
#      like a tag push. That makes the release chain testable without
#      pushing a tag every time.

on:
  push:
    tags: [ 'v*.*.*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (vMAJOR.MINOR.PATCH). Empty = build-only dry run.'
        required: false
        type: string
      publish:
        description: 'Create the GitHub Release (ignored without a tag)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      version_code: ${{ steps.v.outputs.version_code }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      # Werte kommen ueber env, nicht per ${{ }} im Skript: sonst wuerde ein
      # frei eingegebener Tag als Shell-Code ausgefuehrt (Script Injection).
      - name: Derive version from tag
        id: v
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail

          if [ "$EVENT" = "push" ]; then
            TAG="$REF_NAME"
            PUBLISH=true
          else
            TAG="${INPUT_TAG:-}"
            PUBLISH="${INPUT_PUBLISH:-false}"
            if [ -z "$TAG" ]; then
              # Dry-Run: synthetisches Tag, kein Push noetig, nichts publiziert.
              TAG="v0.0.0-ci.${RUN_NUMBER}"
              PUBLISH=false
              echo "::notice::No tag given - dry run with ${TAG}. No release will be published."
            fi
          fi

          V="${TAG#v}"
          if [[ ! "$V" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
            echo "::error::Tag '${TAG}' does not match vMAJOR.MINOR.PATCH"
            exit 1
          fi
          MAJ="${BASH_REMATCH[1]}"; MIN="${BASH_REMATCH[2]}"; PAT="${BASH_REMATCH[3]}"
          CODE=$(( MAJ * 10000 + MIN * 100 + PAT ))
          if [ "$CODE" -lt 1 ]; then CODE=1; fi

          echo "tag=$TAG"      >> "$GITHUB_OUTPUT"
          echo "version=$V"    >> "$GITHUB_OUTPUT"
          echo "version_code=$CODE" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "Release ${TAG} -> versionCode ${CODE}, publish=${PUBLISH}"

  build-linux:
    name: CLI (Linux)
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cross toolchain + qemu
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-12-aarch64-linux-gnu qemu-user-static

      - name: Build linux-x64
        run: |
          make clean && make
          cp hydra-run dist/hydra-run-linux-x64
          strip dist/hydra-run-linux-x64

      - name: Build linux-arm64 (static)
        run: |
          aarch64-linux-gnu-gcc-12 -O3 -static -Wall -Wextra \
              -Iinclude src/hydra_engine.c src/main.c -lm -o dist/hydra-run-linux-arm64

      # Beide Binaries MUESSEN dasselbe Ergebnis liefern wie der skalare
      # Host — sonst waere die NEON-Gleichheitsaussage wieder unbelegt.
      - name: Verify x64 vs arm64 parity
        run: |
          python3 tools/make_dummy_model.py parity.hydra
          ./dist/hydra-run-linux-x64 parity.hydra 42 8 --json 2>/dev/null > /tmp/x64.json
          qemu-aarch64-static ./dist/hydra-run-linux-arm64 parity.hydra 42 8 --json \
              2>/dev/null > /tmp/arm.json
          python3 - << 'EOF'
          import json, sys
          a = json.load(open('/tmp/x64.json')); b = json.load(open('/tmp/arm.json'))
          print('x64:', a['tokens']); print('arm:', b['tokens'])
          if a['tokens'] != b['tokens'] or a['state'] != b['state']:
              print('FAIL: scalar and NEON release binaries disagree', file=sys.stderr)
              sys.exit(1)
          print('OK: release binaries are bit-identical across architectures')
          EOF

      - name: Checksums
        working-directory: dist
        run: sha256sum hydra-run-linux-* > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: hydra-stone-linux
          path: dist/

  build-macos:
    name: CLI (macOS arm64)
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with clang (ARM64, NEON-Pfad aktiv)
        run: |
          mkdir -p dist
          clang -O3 -Wall -Wextra -Iinclude \
              src/hydra_engine.c src/main.c -lm -o dist/hydra-run-macos-arm64
      - name: Smoke test on the release binary
        run: |
          python3 tools/make_dummy_model.py smoke.hydra
          ./dist/hydra-run-macos-arm64 smoke.hydra 42 8 --json 2>/dev/null | head -c 160
          echo
      - name: Checksums
        working-directory: dist
        run: shasum -a 256 hydra-run-macos-arm64 > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: hydra-stone-macos
          path: dist/

  build-android:
    name: Android APK
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Gleiche Reihenfolge wie in lint.yml: eigenes SDK-Root, cmdline-tools
      # explizit installieren (android-actions/setup-android scheitert am
      # nicht mehr existierenden Paket "tools") und ausschliesslich die
      # gepinnten Pakete laden, damit der Release-Build exakt der lokal
      # verifizierten Toolchain entspricht.
      - name: Android SDK isoliert aufsetzen (nur API 34)
        run: |
          set -e
          SDK="$RUNNER_TEMP/android-sdk"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          mkdir -p "$SDK/cmdline-tools"
          cd "$RUNNER_TEMP"
          curl -sSLO https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          rm -rf "$RUNNER_TEMP/cmdline"
          unzip -q commandlinetools-linux-11076708_latest.zip -d "$RUNNER_TEMP/cmdline"
          mv "$RUNNER_TEMP/cmdline/cmdline-tools" "$SDK/cmdline-tools/latest"
          export PATH="$SDK/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" \
                    "build-tools;34.0.0" "ndk;26.3.11579264" "cmake;3.22.1"
          curl -sSL -o gradle.zip \
            https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle.zip -d /opt

      - name: Build APK
        working-directory: android
        env:
          HYDRA_VERSION_NAME: ${{ needs.version.outputs.version }}
          HYDRA_VERSION_CODE: ${{ needs.version.outputs.version_code }}
          HYDRA_KEYSTORE: ${{ secrets.HYDRA_KEYSTORE_BASE64 }}
          HYDRA_KEYSTORE_PASSWORD: ${{ secrets.HYDRA_KEYSTORE_PASSWORD }}
          HYDRA_KEY_ALIAS: ${{ secrets.HYDRA_KEY_ALIAS }}
          HYDRA_KEY_PASSWORD: ${{ secrets.HYDRA_KEY_PASSWORD }}
        run: |
          mkdir -p ../dist
          if [ -n "$HYDRA_KEYSTORE" ]; then
            echo "$HYDRA_KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "HYDRA_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No keystore secret set - the APK is shipped debug-signed (installable, not Play-Store-ready)."
          fi
          /opt/gradle-8.7/bin/gradle assembleRelease --no-daemon -q
          /opt/gradle-8.7/bin/gradle assembleDebug   --no-daemon -q
          cp app/build/outputs/apk/release/app-release.apk \
             "../dist/hydra-stone-${{ needs.version.outputs.version }}-android-arm64v8a-armeabiv7a-x86_64.apk"
          cp app/build/outputs/apk/debug/app-debug.apk ../dist/hydra-stone-debug.apk

      # Without this check an unsigned or incomplete APK could end up as a
      # release artifact.
      - name: Verify the APK is signed, complete and installable
        run: |
          APK="dist/hydra-stone-${{ needs.version.outputs.version }}-android-arm64v8a-armeabiv7a-x86_64.apk"
          test -f "$APK"
          # Paths relative to the isolated SDK root (ANDROID_HOME is set via
          # GITHUB_ENV in the SDK step) - no hardcoded /opt/android-sdk,
          # which does not exist on the runner.
          BT="$ANDROID_HOME/build-tools/34.0.0"
          test -x "$BT/apksigner" || { echo "::error::apksigner is missing"; exit 1; }
          "$BT/apksigner" verify --print-certs "$APK"
          "$BT/aapt" list "$APK" > apk-contents.txt
          for abi in arm64-v8a armeabi-v7a x86_64; do
            grep -q "lib/$abi/libhydra.so" apk-contents.txt || {
              echo "::error::libhydra.so missing for $abi"; exit 1; }
          done
          grep -q 'assets/demo.hydra' apk-contents.txt
          "$BT/aapt" dump badging "$APK" \
            | grep -E "^package:|^sdkVersion:|^application-label:"
      - name: Android Lint must be error-free
        working-directory: android
        run: |
          /opt/gradle-8.7/bin/gradle lintDebug --no-daemon -q
          REPORT=app/build/reports/lint-results-debug.txt
          cat "$REPORT"
          grep -q "No issues found" "$REPORT"
      - name: Checksums
        working-directory: dist
        run: sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: hydra-stone-android
          path: dist/

  publish:
    name: Publish GitHub Release
    needs: [ version, build-linux, build-macos, build-android ]
    # In a manual dry run nothing is published - the four build jobs still
    # run to completion.
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: hydra-stone-*
          path: dist
          merge-multiple: true

      - name: Combined checksum list
        run: |
          cd dist
          sha256sum $(ls | grep -v SHA256SUMS) > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Hydra-Stone ${{ needs.version.outputs.tag }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            dist/*.apk
            dist/hydra-run-linux-x64
            dist/hydra-run-linux-arm64
            dist/hydra-run-macos-arm64
            dist/SHA256SUMS.txt
          body: |
            ## Hydra-Stone ${{ needs.version.outputs.tag }}

            ### Android APK - directly installable

            | File | Contents |
            |---|---|
            | `hydra-stone-*-android-*.apk` | Release-Build, arm64-v8a + armeabi-v7a + x86_64 |
            | `hydra-stone-debug.apk` | Debug-Build, identischer Code |

            Install via sideload (Android 7.0 / API 24 or newer):

            ```bash
            # Option A: on the phone - download the APK, tap it and allow
            #            "Unknown sources" for the browser
            # Option B: via adb
            adb install -r hydra-stone-*-android-*.apk
            ```

            Contains `libhydra.so` for all three ABIs (the C engine itself,
            NEON path on ARM), `assets/demo.hydra` and the launcher icon. The
            app runs an inference on startup and shows the token stream live.

            ### CLI

            | File | Platform |
            |---|---|
            | `hydra-run-linux-x64` | Linux x86-64, statically linked |
            | `hydra-run-linux-arm64` | Linux ARM64 (AArch64), statically linked |
            | `hydra-run-macos-arm64` | macOS Apple Silicon (clang, NEON enabled) |

            ```bash
            python3 tools/make_dummy_model.py demo.hydra
            ./hydra-run-linux-x64 demo.hydra 42 8 --json
            ```

            The x64 and arm64 binaries are checked against each other before
            the release: they must produce bit-identical token **and** state
            vectors. A release with differing results is never created.

            ### Integrity

            ```
            sha256sum -c SHA256SUMS.txt
            ```

            ### What was verified before this release

            - **C:** gcc-strict, clang-strict, GCC `-fanalyzer`, Clang Static
              Analyzer, clang-tidy (bugprone/cert/concurrency), cppcheck,
              flawfinder (Schwelle 4)
            - **C runtime:** full test suite under AddressSanitizer +
              UndefinedBehaviorSanitizer
            - **NEON:** ARM64 build under qemu; token and state vectors
              bit-identical to the scalar path
            - **Web:** ESLint 10 on server and frontend
            - **Android:** Android Lint with 0 findings, NDK clang build for 3 ABIs
            - **JNI:** `javac -h` header check against the C bridge

            ### Signature note

            If this release was built without a stored keystore secret, the APK
            is signed with the debug key: fully installable, but not suitable
            for the Google Play Store. For Play Store releases store
            `HYDRA_KEYSTORE_BASE64`, `HYDRA_KEYSTORE_PASSWORD`, `HYDRA_KEY_ALIAS`
            and `HYDRA_KEY_PASSWORD` as repository secrets.