name: 'Setup Android SDK (pinned, isolated, cacheable)'
description: >-
  Installs the Android command-line tools and exactly the pinned SDK
  packages into an isolated SDK root under $HOME (a cacheable location)
  and puts both sdkmanager and the build-tools on the PATH. Used by
  every workflow that needs Android so the toolchain can never drift
  between jobs. When the caller restores the pinned-version cache first,
  every download is skipped and the step reports the installed state
  instead (the 2026-10-26 CI speed-up: the NDK alone is ~1 GB and used
  to be re-downloaded on every run of every Android job).

inputs:
  gradle:
    description: 'Also install Gradle 8.7 under $HOME/gradle-dist'
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    # Two failure sources are handled here:
    # 1) android-actions/setup-android@v3 runs `sdkmanager tools`, a
    #    package that has been removed from Google's repository, and
    #    fails with exit 1.
    # 2) The hosted runner ships a prebuilt SDK that also contains
    #    platforms 35 and 36. Android Lint evaluates OldTargetApi against
    #    the platforms that are present, so it would flag the pinned
    #    targetSdk 34 even though that toolchain is the verified one.
    #    An own SDK root containing nothing but the pinned packages
    #    removes that environment-dependent finding.
    #
    # The root is $HOME/android-sdk, not $RUNNER_TEMP: workflows wrap this
    # action in actions/cache keyed on the pinned versions below, and
    # $RUNNER_TEMP is wiped between steps in a way the cache cannot see.
    - name: Install Android SDK into an isolated root (API 34 only)
      shell: bash
      run: |
        set -euo pipefail
        SDK="$HOME/android-sdk"
        GRADLE_DIST="$HOME/gradle-dist"
        echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
        echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
        echo "GRADLE_BIN=$GRADLE_DIST/gradle-8.7/bin/gradle" >> "$GITHUB_ENV"
        echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
        echo "$SDK/platform-tools" >> "$GITHUB_PATH"
        # Cache hit: every pinned package is already installed. Skip the
        # multi-hundred-MB downloads and just prove the state. A partially
        # restored cache falls through to the full install below -
        # sdkmanager only adds what is missing, never downgrades.
        if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ] \
           && [ -d "$SDK/platforms/android-34" ] \
           && [ -d "$SDK/build-tools/34.0.0" ] \
           && [ -d "$SDK/ndk/26.3.11579264" ] \
           && [ -d "$SDK/cmake/3.22.1" ] \
           && [ -d "$SDK/platform-tools" ] \
           && [ -x "$GRADLE_DIST/gradle-8.7/bin/gradle" ]; then
          echo "android-sdk: all pinned packages present (cache hit) - skipping downloads"
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --list_installed
          exit 0
        fi
        mkdir -p "$SDK/cmdline-tools"
        cd "$RUNNER_TEMP"
        curl -sSLO https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        rm -rf "$RUNNER_TEMP/cmdline"
        unzip -q commandlinetools-linux-11076708_latest.zip -d "$RUNNER_TEMP/cmdline"
        mv "$RUNNER_TEMP/cmdline/cmdline-tools" "$SDK/cmdline-tools/latest"
        export PATH="$SDK/cmdline-tools/latest/bin:$PATH"
        yes | sdkmanager --licenses > /dev/null 2>&1 || true
        sdkmanager "platform-tools" "platforms;android-34" \
                  "build-tools;34.0.0" "ndk;26.3.11579264" "cmake;3.22.1"
        sdkmanager --list_installed

    - name: Install Gradle 8.7
      if: ${{ inputs.gradle == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        GRADLE_DIST="$HOME/gradle-dist"
        if [ -x "$GRADLE_DIST/gradle-8.7/bin/gradle" ]; then
          echo "gradle: already present (cache hit)"
        else
          mkdir -p "$GRADLE_DIST"
          cd "$RUNNER_TEMP"
          curl -sSL -o gradle.zip \
            https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle.zip -d "$GRADLE_DIST"
        fi
        "$GRADLE_DIST/gradle-8.7/bin/gradle" --version

    - name: Report the toolchain
      shell: bash
      run: |
        set -euo pipefail
        {
          echo "ANDROID_HOME=$ANDROID_HOME"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" version
          echo "javac: $(javac -version 2>&1 || echo 'not installed')"
        } | tee -a "$GITHUB_STEP_SUMMARY"
