name: 'Setup Android SDK (pinned, isolated)'
description: >-
  Installs the Android command-line tools and exactly the pinned SDK
  packages into an isolated SDK root and puts both sdkmanager and the
  build-tools on the PATH. Used by every workflow that needs Android so
  the toolchain can never drift between jobs.

inputs:
  gradle:
    description: 'Also install Gradle 8.7 under $RUNNER_TEMP'
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    # Two failure sources are handled here:
    # 1) android-actions/setup-android@v3 runs `sdkmanager tools`, a
    #    package that has been removed from Google's repository, and
    #    fails with exit 1.
    # 2) The hosted runner ships a prebuilt SDK that also contains
    #    platforms 35 and 36. Android Lint evaluates OldTargetApi against
    #    the platforms that are present, so it would flag the pinned
    #    targetSdk 34 even though that toolchain is the verified one.
    #    An own SDK root containing nothing but the pinned packages
    #    removes that environment-dependent finding.
    - name: Install Android SDK into an isolated root (API 34 only)
      shell: bash
      run: |
        set -euo pipefail
        SDK="$RUNNER_TEMP/android-sdk"
        echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
        echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
        echo "GRADLE_BIN=$RUNNER_TEMP/gradle-8.7/bin/gradle" >> "$GITHUB_ENV"
        echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
        echo "$SDK/platform-tools" >> "$GITHUB_PATH"
        mkdir -p "$SDK/cmdline-tools"
        cd "$RUNNER_TEMP"
        curl -sSLO https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        rm -rf "$RUNNER_TEMP/cmdline"
        unzip -q commandlinetools-linux-11076708_latest.zip -d "$RUNNER_TEMP/cmdline"
        mv "$RUNNER_TEMP/cmdline/cmdline-tools" "$SDK/cmdline-tools/latest"
        export PATH="$SDK/cmdline-tools/latest/bin:$PATH"
        yes | sdkmanager --licenses > /dev/null 2>&1 || true
        sdkmanager "platform-tools" "platforms;android-34" \
                  "build-tools;34.0.0" "ndk;26.3.11579264" "cmake;3.22.1"
        sdkmanager --list_installed

    - name: Install Gradle 8.7
      if: ${{ inputs.gradle == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        cd "$RUNNER_TEMP"
        curl -sSL -o gradle.zip \
          https://services.gradle.org/distributions/gradle-8.7-bin.zip
        unzip -q gradle.zip -d "$RUNNER_TEMP"
        "$RUNNER_TEMP/gradle-8.7/bin/gradle" --version

    - name: Report the toolchain
      shell: bash
      run: |
        set -euo pipefail
        {
          echo "ANDROID_HOME=$ANDROID_HOME"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" version
          echo "javac: $(javac -version 2>&1 || echo 'not installed')"
        } | tee -a "$GITHUB_STEP_SUMMARY"