# Issue -> verification gate mapping for tools/issue_verify.py.
#
# An issue listed here is closed automatically - with a comment linking
# the proving commit and run - ONLY when every one of its gates exits 0
# on the commit the issue-verify workflow was triggered by. A failing
# gate closes nothing and makes the run red. Already-closed or missing
# issues are skipped, so re-runs never fail on stale entries.
#
# Shape (keep it flat - tools/issue_verify.py's dependency-free fallback
# parser understands exactly this; if PyYAML is importable it wins, but
# the fallback is the contract):
#   issues:
#     "<number>":
#       summary: "<one line: what the green run proved>"
#       gates:
#         - "<shell command>"
#
# Add an entry when an issue is implemented; remove it once the issue is
# closed, or leave it (a closed issue is skipped, it only costs a gh call).

issues:
  "52":
    summary: "Problem check done 2026-10-26: the Compose 'infinity maximum height' crash (nested verticalScroll in the chat header) is fixed, guarded by tools/compose_scroll_check.sh with negative controls, and the full C test suite (make test-run) passes on this commit."
    gates:
      - "bash tools/compose_scroll_check.sh"
      - "make clean && make -j2 test-run"
